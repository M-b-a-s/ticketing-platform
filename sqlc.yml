version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/queries"
    schema: "migrations"
    gen:
      go:
        package: "db"
        out: "internal/platform/database/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
          - db_type: "citext"
            go_type: "string"