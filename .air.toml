root = "."
tmp_dir = "tmp"

[build]
  cmd             = "go build -o ./tmp/api.exe ./cmd/api"
  bin             = "tmp/api.exe"
  include_ext     = ["go"]
  include_dir     = ["cmd", "internal"]   # skip docs/, migrations/, tests/ — no rebuild churn
  exclude_regex   = ["_test.go"]
  delay           = 500                    # ms of quiet before rebuilding
  stop_on_error   = false                  # keep the old binary running while you fix a broken build
  send_interrupt  = true
  kill_delay      = 2000

[log]
  time = true

[color]
  build  = "yellow"
  runner = "green"